<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1120" height="780" fill="#ffffff"/>
  <text x="560" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A2329">Modelo de datos (DER simplificado) — entidades principales</text>
  <text x="560" y="56" text-anchor="middle" font-size="12" fill="#5B6770">Se muestran las entidades centrales y sus relaciones. Detalle completo de columnas en docs/database.md</text>

  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8E97A0"/></marker>
    <style>
      .ent rect.h{fill:#1A2329}
      .ent rect.b{fill:#ffffff;stroke:#C9D0D5}
      .ent text.t{fill:#ffffff;font-size:13px;font-weight:700}
      .ent text.f{fill:#3E4A52;font-size:11.5px}
      .rel{stroke:#8E97A0;stroke-width:1.6;fill:none}
      .card{fill:#5B6770;font-size:11px}
    </style>
  </defs>

  <!-- tenant -->
  <g class="ent"><rect class="h" x="60" y="90" width="170" height="26" rx="5"/><text class="t" x="72" y="108">tenant (empresa)</text>
    <rect class="b" x="60" y="116" width="170" height="46"/><text class="f" x="72" y="134">id (PK) · name</text><text class="f" x="72" y="152">plan_id · owner_user_id</text></g>

  <!-- user -->
  <g class="ent"><rect class="h" x="60" y="230" width="170" height="26" rx="5"/><text class="t" x="72" y="248">user</text>
    <rect class="b" x="60" y="256" width="170" height="60"/><text class="f" x="72" y="274">id (PK) · email · role</text><text class="f" x="72" y="292">whatsapp_number</text><text class="f" x="72" y="310">tenant_id (FK)</text></g>

  <!-- supplier -->
  <g class="ent"><rect class="h" x="60" y="400" width="170" height="26" rx="5"/><text class="t" x="72" y="418">supplier</text>
    <rect class="b" x="60" y="426" width="170" height="46"/><text class="f" x="72" y="444">id (PK) · name</text><text class="f" x="72" y="462">tenant_id (FK)</text></g>

  <!-- obra (hub) -->
  <g class="ent"><rect class="h" x="430" y="250" width="200" height="26" rx="5"/><text class="t" x="442" y="268">obra (HUB)</text>
    <rect class="b" x="430" y="276" width="200" height="78"/><text class="f" x="442" y="294">id (PK) · name · status</text><text class="f" x="442" y="312">manager_id (FK→user)</text><text class="f" x="442" y="330">tenant_id (FK)</text><text class="f" x="442" y="348">client_name · fechas</text></g>

  <!-- task -->
  <g class="ent"><rect class="h" x="780" y="90" width="200" height="26" rx="5"/><text class="t" x="792" y="108">task</text>
    <rect class="b" x="780" y="116" width="200" height="78"/><text class="f" x="792" y="134">id (PK) · title · status</text><text class="f" x="792" y="152">obra_id (FK)</text><text class="f" x="792" y="170">responsible_id (FK)</text><text class="f" x="792" y="188">parent_task_id (self)</text></g>
  <!-- task self dependency M2M -->
  <g class="ent"><rect class="h" x="780" y="220" width="200" height="22" rx="5"/><text class="t" x="792" y="236" style="font-size:11px">task_dependencies (M2M)</text>
    <rect class="b" x="780" y="242" width="200" height="22"/><text class="f" x="792" y="257">tipo (FS/SS/FF/SF) · lag</text></g>

  <!-- responsible -->
  <g class="ent"><rect class="h" x="780" y="300" width="200" height="26" rx="5"/><text class="t" x="792" y="318">responsible</text>
    <rect class="b" x="780" y="326" width="200" height="46"/><text class="f" x="792" y="344">id (PK) · full_name</text><text class="f" x="792" y="362">whatsapp_number · tenant_id</text></g>

  <!-- obra_team_member -->
  <g class="ent"><rect class="h" x="600" y="430" width="220" height="22" rx="5"/><text class="t" x="612" y="446" style="font-size:11px">obra_team_member (M2M)</text>
    <rect class="b" x="600" y="452" width="220" height="22"/><text class="f" x="612" y="467">obra_id · responsible_id · role</text></g>

  <!-- alert -->
  <g class="ent"><rect class="h" x="430" y="430" width="150" height="26" rx="5"/><text class="t" x="442" y="448">alert</text>
    <rect class="b" x="430" y="456" width="150" height="46"/><text class="f" x="442" y="474">id · type · is_read</text><text class="f" x="442" y="492">obra_id · task_id</text></g>

  <!-- bitacora_entry -->
  <g class="ent"><rect class="h" x="430" y="540" width="200" height="26" rx="5"/><text class="t" x="442" y="558">bitacora_entry</text>
    <rect class="b" x="430" y="566" width="200" height="60"/><text class="f" x="442" y="584">id · transcript · summary</text><text class="f" x="442" y="602">suggestions (JSON)</text><text class="f" x="442" y="620">obra_id · responsible_id</text></g>

  <!-- budget -->
  <g class="ent"><rect class="h" x="690" y="540" width="180" height="26" rx="5"/><text class="t" x="702" y="558">budget (presupuesto)</text>
    <rect class="b" x="690" y="566" width="180" height="60"/><text class="f" x="702" y="584">id · supplier_name · total</text><text class="f" x="702" y="602">data · inconsistencies</text><text class="f" x="702" y="620">obra_id · tenant_id</text></g>

  <!-- plano -->
  <g class="ent"><rect class="h" x="430" y="660" width="200" height="26" rx="5"/><text class="t" x="442" y="678">plano</text>
    <rect class="b" x="430" y="686" width="200" height="60"/><text class="f" x="442" y="704">id · discipline · version</text><text class="f" x="442" y="722">is_latest · file_path</text><text class="f" x="442" y="740">obra_id · tenant_id</text></g>

  <!-- task_material -->
  <g class="ent"><rect class="h" x="900" y="540" width="170" height="26" rx="5"/><text class="t" x="912" y="558">task_material</text>
    <rect class="b" x="900" y="566" width="170" height="46"/><text class="f" x="912" y="584">id · name · qty · price</text><text class="f" x="912" y="602">task_id · supplier_id</text></g>

  <!-- Relaciones -->
  <g class="rel" marker-end="url(#t)">
    <line x1="145" y1="162" x2="145" y2="228"/>            <!-- tenant→user -->
    <line x1="230" y1="300" x2="428" y2="300"/>            <!-- user→obra (manager) -->
    <line x1="630" y1="170" x2="778" y2="155"/>            <!-- obra→task -->
    <line x1="980" y1="155" x2="980" y2="218"/>            <!-- task→deps -->
    <line x1="880" y1="194" x2="880" y2="298"/>            <!-- task→responsible -->
    <line x1="710" y1="430" x2="630" y2="340"/>            <!-- team→obra -->
    <line x1="790" y1="372" x2="730" y2="430"/>            <!-- responsible→team -->
    <line x1="520" y1="354" x2="505" y2="428"/>            <!-- obra→alert -->
    <line x1="520" y1="354" x2="525" y2="538"/>            <!-- obra→bitacora -->
    <line x1="630" y1="330" x2="760" y2="540"/>            <!-- obra→budget -->
    <line x1="510" y1="354" x2="510" y2="658"/>            <!-- obra→plano -->
    <line x1="950" y1="194" x2="975" y2="538"/>            <!-- task→material -->
  </g>
  <g class="card">
    <text x="150" y="200">1..N</text>
    <text x="320" y="292">1..N</text>
    <text x="690" y="150">1..N</text>
    <text x="845" y="250">1</text>
  </g>
</svg>
