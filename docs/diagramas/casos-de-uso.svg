<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1A2329">Diagrama de casos de uso — CONSTRUCTA</text>

  <!-- Actor izquierdo: Administrador / Arquitecto -->
  <g stroke="#1A2329" stroke-width="2" fill="none">
    <circle cx="80" cy="150" r="16"/>
    <line x1="80" y1="166" x2="80" y2="210"/>
    <line x1="52" y1="182" x2="108" y2="182"/>
    <line x1="80" y1="210" x2="56" y2="248"/>
    <line x1="80" y1="210" x2="104" y2="248"/>
  </g>
  <text x="80" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2329">Administrador /</text>
  <text x="80" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2329">Arquitecto</text>
  <text x="80" y="307" text-anchor="middle" font-size="11" fill="#5B6770">(aplicación web)</text>

  <!-- Actor derecho: Responsable -->
  <g stroke="#1A2329" stroke-width="2" fill="none">
    <circle cx="920" cy="380" r="16"/>
    <line x1="920" y1="396" x2="920" y2="440"/>
    <line x1="892" y1="412" x2="948" y2="412"/>
    <line x1="920" y1="440" x2="896" y2="478"/>
    <line x1="920" y1="440" x2="944" y2="478"/>
  </g>
  <text x="920" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2329">Responsable /</text>
  <text x="920" y="519" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2329">Staff de obra</text>
  <text x="920" y="537" text-anchor="middle" font-size="11" fill="#5B6770">(WhatsApp)</text>

  <!-- Límite del sistema -->
  <rect x="230" y="70" width="540" height="540" rx="14" fill="#FAFBFA" stroke="#D5D9D5" stroke-width="1.5"/>
  <text x="500" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#3E4A52">CONSTRUCTA</text>

  <!-- Casos de uso (elipses) -->
  <g font-size="12.5" fill="#1A2329" text-anchor="middle">
    <ellipse cx="380" cy="135" rx="120" ry="26" fill="#FFF1E9" stroke="#FF6B35"/><text x="380" y="140">Gestionar obra</text>
    <ellipse cx="380" cy="200" rx="120" ry="26" fill="#FFF1E9" stroke="#FF6B35"/><text x="380" y="205">Planificar tareas (Gantt)</text>
    <ellipse cx="380" cy="265" rx="120" ry="26" fill="#FFF1E9" stroke="#FF6B35"/><text x="380" y="270">Cargar planos</text>
    <ellipse cx="380" cy="330" rx="120" ry="26" fill="#FFF1E9" stroke="#FF6B35"/><text x="380" y="335">Gestionar presupuestos</text>
    <ellipse cx="380" cy="395" rx="120" ry="26" fill="#FFF1E9" stroke="#FF6B35"/><text x="380" y="400">Recibir alertas</text>

    <ellipse cx="600" cy="300" rx="125" ry="26" fill="#EAF2FF" stroke="#2A62C9"/><text x="600" y="305">Reportar estado de tarea</text>
    <ellipse cx="600" cy="370" rx="125" ry="28" fill="#EAF2FF" stroke="#2A62C9"/><text x="600" y="367">Registrar nota de voz</text><text x="600" y="382" font-size="11" fill="#5B6770">(bitácora con IA)</text>
    <ellipse cx="600" cy="445" rx="125" ry="26" fill="#EAF2FF" stroke="#2A62C9"/><text x="600" y="450">Consultar plano</text>
  </g>

  <!-- Asociaciones administrador -->
  <g stroke="#9BA3AB" stroke-width="1.3">
    <line x1="110" y1="195" x2="262" y2="138"/>
    <line x1="112" y1="200" x2="260" y2="200"/>
    <line x1="110" y1="210" x2="262" y2="262"/>
    <line x1="112" y1="215" x2="260" y2="328"/>
    <line x1="110" y1="225" x2="260" y2="392"/>
    <!-- admin también registra bitácora desde web/WhatsApp -->
    <line x1="118" y1="222" x2="478" y2="368" stroke-dasharray="4 3"/>
  </g>
  <!-- Asociaciones responsable -->
  <g stroke="#9BA3AB" stroke-width="1.3">
    <line x1="890" y1="395" x2="724" y2="305"/>
    <line x1="890" y1="400" x2="724" y2="372"/>
    <line x1="890" y1="408" x2="724" y2="448"/>
  </g>
</svg>
