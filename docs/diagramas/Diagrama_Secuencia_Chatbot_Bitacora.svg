<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2900" height="1960" viewBox="0 0 2900 1960">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#5e6b76"/>
  </marker>
  <style>
    .title {font-family:Arial,Helvetica,sans-serif;font-size:42px;font-weight:700;fill:#202830}
    .subtitle {font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#56636e}
    .actor {font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#27333c}
    .actorSub {font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#596772}
    .section {font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f4fa3}
    .section2 {font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#13754d}
    .msg {font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#3f4c56}
    .small {font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#56636e}
    .note {font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#596772}
